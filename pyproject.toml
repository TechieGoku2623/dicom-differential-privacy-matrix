[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-differential-privacy-matrix"
version = "1.0.0"
description = "Differential-privacy release path for synthetic DICOM numeric tags, with Laplace noise and HIPAA Safe Harbor generalization."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TechieGoku2623" }]
dependencies = []

[project.optional-dependencies]
dev = ["black==24.8.0", "flake8==7.1.1"]

[project.scripts]
dicom-differential-privacy-matrix = "dicom_differential_privacy_matrix.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
